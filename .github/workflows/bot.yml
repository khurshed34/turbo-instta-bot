name: TurboInstta Bot

on:
workflow_dispatch:
schedule:
- cron: "0 */5 * * *"

concurrency:
group: turbo-instta-bot
cancel-in-progress: true

jobs:
run-bot:
runs-on: ubuntu-latest
timeout-minutes: 350

steps:  
  - name: Get code  
    uses: actions/checkout@v4  

  - name: Install Python  
    uses: actions/setup-python@v5  
    with:  
      python-version: "3.11"  

  - name: Install requirements  
    run: pip install -r requirements.txt  

  - name: Start bot  
    env:  
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}  
    run: python main.py
