
name: TurboInstta Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: turbo-instta-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    name: Run TurboInstta
    runs-on: ubuntu-latest

    timeout-minutes: 350

    steps:
      # 1. Гирифтани код аз GitHub
      - name: Get repository code
        uses: actions/checkout@v4

      # 2. Насби Python
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # 3. Насби FFmpeg барои MP3
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      # 4. Навсозии pip
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 5. Насби китобхонаҳои бот
      - name: Install requirements
        run: |
          pip install -r requirements.txt

      # 6. Санҷиши yt-dlp ва FFmpeg
      - name: Check dependencies
        run: |
          python -m yt_dlp --version
          ffmpeg -version

      # 7. Оғози бот
      - name: Start TurboInstta
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        run: |
          python -u main.py
